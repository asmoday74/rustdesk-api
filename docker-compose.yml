services:
  db:
    image: postgres:15
    container_name: rustdesk-db
    restart: always
    environment:
      - POSTGRES_USER=rustdesk
      - POSTGRES_PASSWORD=rustdesk
      - POSTGRES_DB=rustdesk_monitor  # Убедитесь, что имя базы совпадает с DSN
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustdesk -d rustdesk_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rustdesk-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  rustdesk-monitor:
    build: .
    container_name: rustdesk-monitor
    restart: always
    ports:
      - "21114:21114"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - TZ=Europe/Moscow
      - DB_DSN=postgresql://rustdesk:rustdesk@db:5432/rustdesk_monitor
      - SECRET_KEY=your-secret-key-change-this-in-production
      # Шаблон оформления: rustdesk (тёмная/светлая схема) или sve (прежний)
      - TEMPLATE=rustdesk
      # Схема URI для кнопки «Подключить» (<схема>://connection/new/<id>).
      # Для кастомного клиента укажите имя приложения из генератора в нижнем
      # регистре (например, svedesk). По умолчанию — rustdesk.
      # - RD_URI_SCHEME=rustdesk
      # ===== LDAP / Active Directory (доменная аутентификация) =====
      # Вход по user@domain.name или DOMAIN\User. По умолчанию выключено.
      # - LDAP_ENABLED=1
      # - LDAP_SERVER=ldap://dc.domain.name:389      # или ldaps://dc.domain.name:636
      # - LDAP_BASE_DN=DC=domain,DC=name
      # - LDAP_BIND_DN=CN=svc_rustdesk,OU=Service,DC=domain,DC=name
      # - LDAP_BIND_PASSWORD=change-me
      # - LDAP_USER_FILTER=(|(sAMAccountName={login})(userPrincipalName={login}))
      # - LDAP_TIMEOUT=10
      # ===== Встроенный генератор кастомных клиентов (GitHub Actions) =====
      # Репозиторий с воркфлоу generator-*.yml (этот репозиторий)
      - GH_USER=your-github-user
      - GH_REPO=rustdesk-api
      - GH_BRANCH=main
      # PAT с правом запускать Actions (actions:write)
      - GH_TOKEN=your-github-token
      # Публичный URL этого сервера, доступный раннерам GitHub
      - GENURL=https://rd.example.com:21114
      # Пароль AES-архива с секретами сборки (совпадает с секретом ZIP_PASSWORD
      # репозитория GitHub только при использовании готовых воркфлоу без изменений)
      - ZIP_PASSWORD=change-me
      - PROTOCOL=https
      # Необязательно: секрет self-hosted сборки (sh-generator-windows.yml)
      # - SH_SECRET=
    volumes:
      - ./static:/app/static
      - ./templates:/app/templates
      - ./data:/data
    networks:
      - rustdesk-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  rustdesk-network:
    driver: bridge