<!DOCTYPE html>
<html lang="ru" data-design="rustdesk" data-theme="{{ theme }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>{% block title %}RustDesk{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/theme/img/logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/theme/css/design.css">
    <script>
        (function () { var d = document.documentElement;
            try { var t = localStorage.getItem('ui_theme');
                  if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t); } catch (e) {} })();
    </script>
</head>
<body>
<div class="layout">
    <header class="rd-topbar">
        <div class="rd-brand">
            <img src="/theme/img/logo.svg" alt="RustDesk">
            <span class="rd-title">RustDesk Консоль</span>
        </div>
        <div class="rd-top-actions">
            <button class="icon-btn" data-action="toggle-theme" title="Сменить схему"><i class="fas fa-moon"></i></button>
            <span class="rd-user"><span class="avatar">{{ username[:1] if username else 'U' }}</span>{{ username }}</span>
            <a class="icon-btn" href="/logout" title="Выход"><i class="fas fa-sign-out-alt"></i></a>
        </div>
    </header>
    <div class="rd-body">
        <aside class="rd-sidebar">
            <nav class="rd-nav">
                <a href="/" class="{% if active == 'index' %}active{% endif %}"><i class="fas fa-desktop"></i> Устройства</a>
                <a href="/ab" class="{% if active == 'ab' %}active{% endif %}"><i class="fas fa-book"></i> Адресная книга</a>
                {% if is_admin %}<a href="/admin" class="{% if active == 'admin' %}active{% endif %}"><i class="fas fa-users-cog"></i> Управление</a>{% endif %}
                {% if is_admin %}<a href="/audit" class="{% if active == 'audit' %}active{% endif %}"><i class="fas fa-shield-alt"></i> Аудит безопасности</a>{% endif %}
            </nav>
        </aside>
        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>
<script src="/static/js/ui.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
