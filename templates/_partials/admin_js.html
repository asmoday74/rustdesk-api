<script>
    let allGroups=[]; let currentUserId=null;
    let sessionCheckInterval=null; let activityTimeout=null;

    async function checkSession(){ try{ const r=await fetch('/api/session/check'); const d=await r.json();
        if(!d.active){ showToast(t('session_expired'),true); setTimeout(()=>window.location.href='/login',2000); return false;} return true; }catch(e){return true;} }
    async function extendSession(){ try{await fetch('/api/session/extend',{method:'POST'});}catch(e){} }
    function updateActivity(){ extendSession(); if(activityTimeout) clearTimeout(activityTimeout); activityTimeout=setTimeout(()=>checkSession(),120000); }
    document.addEventListener('click',updateActivity); document.addEventListener('keypress',updateActivity);
    sessionCheckInterval=setInterval(async()=>{ if(!await checkSession()) clearInterval(sessionCheckInterval); },60000);

    function showToast(m,err=false){ const tEl=document.getElementById('toast'); const msg=document.getElementById('toastMessage'); const i=tEl.querySelector('i');
        msg.textContent=m; i.className=err?'fas fa-exclamation-triangle':'fas fa-check-circle';
        tEl.style.borderLeftColor=err?'var(--danger)':'var(--accent)'; tEl.classList.add('show'); setTimeout(()=>tEl.classList.remove('show'),3000); }
    function escapeHtml(s){ if(!s)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function formatDate(d){ if(!d)return t('never'); const dt=new Date(d); if(isNaN(dt))return t('never');
        const diff=(new Date()-dt)/1000; if(diff<60)return t('just_now'); if(diff<3600)return t('mins_ago',{n:Math.floor(diff/60)}); if(diff<86400)return t('hours_ago',{n:Math.floor(diff/3600)});
        return dt.toLocaleString(t('locale')); }

    async function loadGroups(){ try{ const r=await fetch('/api/web/groups'); if(r.ok){ allGroups=await r.json(); fillGroupSelects(); } }catch(e){} }
    function fillGroupSelects(){ const s=document.getElementById('newGroup');
        s.innerHTML=allGroups.map(g=>`<option value="${g.id}">${escapeHtml(g.name)}</option>`).join(''); }

    async function loadUsers(){ try{ const r=await fetch('/api/users'); if(!r.ok)return; const users=await r.json();
        const tb=document.getElementById('usersTableBody');
        if(!users.length){ tb.innerHTML=`<tr><td colspan="7" class="empty-state">${t('no_users')}</td></tr>`; return; }
        tb.innerHTML=users.map(u=>{ const g=allGroups.find(x=>x.id===u.group_id);
            return `<tr><td>${u.id}</td><td><b>${escapeHtml(u.username)}</b></td>
            <td>${u.role==='admin'?`<span class="tag-badge">${t('role_admin_short')}</span>`:t('role_user')}</td>
            <td>${escapeHtml(g?g.name:'-')}</td><td>${escapeHtml(u.email||'-')}</td><td>${formatDate(u.created_at)}</td>
            <td><div class="action-cell">
                <button class="btn btn-warn btn-sm" data-i18n-title="change_password" onclick="openPasswordModal(${u.id},'${escapeHtml(u.username)}')"><i class="fas fa-key"></i></button>
                <button class="btn btn-danger btn-sm" data-i18n-title="delete_user" onclick="deleteUser(${u.id},'${escapeHtml(u.username)}')"><i class="fas fa-trash"></i></button>
            </div></td></tr>`; }).join('');
        applyI18n(tb); }catch(e){} }

    async function deleteUser(id,name){ if(!confirm(t('confirm_delete_user',{name})))return;
        const r=await fetch(`/api/users/${id}`,{method:'DELETE'}); if(r.ok){showToast(t('user_deleted'));loadUsers();} else showToast(t('error'),true); }

    // Модалки
    const userModal=document.getElementById('userModal');
    document.getElementById('addUserBtn').onclick=()=>{ userModal.classList.add('active'); };
    userModal.querySelector('.close').onclick=()=>userModal.classList.remove('active');
    document.getElementById('addUserForm').addEventListener('submit', async e=>{ e.preventDefault();
        const data={username:newUsername.value,password:newPassword.value,role:newRole.value,email:newEmail.value,group_id:parseInt(newGroup.value||'1')};
        const r=await fetch('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
        if(r.ok){ showToast(t('user_created')); userModal.classList.remove('active'); e.target.reset(); loadUsers(); } else { const d=await r.json(); showToast(d.error||t('error'),true); } });

    const passwordModal=document.getElementById('passwordModal');
    function openPasswordModal(id,name){ currentUserId=id; passwordUser.value=name; newPasswordField.value=''; confirmPasswordField.value=''; passwordModal.classList.add('active'); }
    passwordModal.querySelector('.close-password-modal').onclick=()=>passwordModal.classList.remove('active');
    document.getElementById('passwordForm').addEventListener('submit', async e=>{ e.preventDefault();
        if(newPasswordField.value.length<4){showToast(t('password_min_len'),true);return;}
        if(newPasswordField.value!==confirmPasswordField.value){showToast(t('passwords_mismatch'),true);return;}
        const r=await fetch(`/api/users/${currentUserId}/password`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({new_password:newPasswordField.value})});
        if(r.ok){ showToast(t('password_changed')); passwordModal.classList.remove('active'); } else showToast(t('error'),true); });

    window.onclick=e=>{ [userModal,passwordModal].forEach(m=>{ if(e.target===m) m.classList.remove('active'); }); };

    (async()=>{ await loadGroups(); loadUsers(); })();
</script>
