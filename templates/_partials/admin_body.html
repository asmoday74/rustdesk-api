<h1 class="page-title" data-i18n="nav_users">Пользователи</h1>

<section id="section-users">
<div class="panel">
    <div class="panel-head">
        <h3 data-i18n="users_title">Пользователи</h3>
        <button class="btn btn-primary" id="addUserBtn"><i class="fas fa-plus"></i> <span data-i18n="add_user">Добавить пользователя</span></button>
    </div>
    <div class="table-wrapper">
        <table class="computers-table">
            <thead><tr>
                <th>ID</th>
                <th data-i18n="login_label">Логин</th>
                <th data-i18n="role">Роль</th>
                <th data-i18n="group">Группа</th>
                <th>Email</th>
                <th data-i18n="created_at">Создан</th>
                <th data-i18n="col_actions">Действия</th>
            </tr></thead>
            <tbody id="usersTableBody"><tr><td colspan="7" class="empty-state" data-i18n="loading">Загрузка...</td></tr></tbody>
        </table>
    </div>
</div>

</section>

<!-- Модалка пользователя -->
<div id="userModal" class="modal"><div class="modal-content">
    <div class="modal-header"><h3 data-i18n="add_user">Добавить пользователя</h3><button class="close">&times;</button></div>
    <form id="addUserForm">
        <div class="form-group"><label><span data-i18n="login_label">Логин</span> *</label><input type="text" id="newUsername" required></div>
        <div class="form-group"><label><span data-i18n="password_label">Пароль</span> *</label><input type="password" id="newPassword" required></div>
        <div class="form-group"><label data-i18n="role">Роль</label><select id="newRole"><option value="user" data-i18n="role_user">Пользователь</option><option value="admin" data-i18n="role_admin">Администратор</option></select></div>
        <div class="form-group"><label data-i18n="group">Группа</label><select id="newGroup"></select></div>
        <div class="form-group"><label>Email</label><input type="email" id="newEmail"></div>
        <button type="submit" class="btn btn-primary" data-i18n="create">Создать</button>
    </form>
</div></div>

<!-- Модалка смены пароля -->
<div id="passwordModal" class="modal"><div class="modal-content">
    <div class="modal-header"><h3 data-i18n="change_password">Смена пароля</h3><button class="close close-password-modal">&times;</button></div>
    <form id="passwordForm">
        <div class="form-group"><label data-i18n="user_label">Пользователь</label><input type="text" id="passwordUser" disabled></div>
        <div class="form-group"><label><span data-i18n="new_password">Новый пароль</span> *</label><input type="password" id="newPasswordField" required minlength="4"></div>
        <div class="form-group"><label><span data-i18n="confirm_password">Подтверждение</span> *</label><input type="password" id="confirmPasswordField" required></div>
        <button type="submit" class="btn btn-primary" data-i18n="change_password_btn">Сменить пароль</button>
    </form>
</div></div>

<div id="toast" class="toast-notification"><i class="fas fa-info-circle"></i><span id="toastMessage"></span></div>
