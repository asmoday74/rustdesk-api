<h1 class="page-title">Создание клиента</h1>

<div id="cfgListView">
    <div class="panel">
        <div class="panel-head">
            <h3>Конфигурации клиентов</h3>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn btn-primary" onclick="openEditor()"><i class="fas fa-plus"></i> Создать</button>
                <button class="btn btn-ghost" onclick="loadConfigs()"><i class="fas fa-sync-alt"></i></button>
            </div>
        </div>
        <div class="table-wrapper">
            <table class="computers-table">
                <thead><tr>
                    <th>Название конфигурации</th>
                    <th>ОС</th>
                    <th>Версия клиента</th>
                    <th>Сборка</th>
                    <th>Дата сборки</th>
                    <th>Автор</th>
                    <th>Действия</th>
                </tr></thead>
                <tbody id="cfgBody"><tr><td colspan="7" class="empty-state">Загрузка...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<div id="cfgEditorView" style="display:none">
    <div class="panel">
        <div class="cg-os-title">OS</div>
        <div class="cg-os-row">
            <button type="button" class="cg-os-btn active" data-os="windows"><i class="fab fa-windows"></i> Windows</button>
            <button type="button" class="cg-os-btn" data-os="macos"><i class="fab fa-apple"></i> MacOS</button>
            <button type="button" class="cg-os-btn" data-os="linux"><i class="fab fa-linux"></i> Linux</button>
            <button type="button" class="cg-os-btn" data-os="android"><i class="fab fa-android"></i> Android</button>
        </div>
    </div>

    <div class="cg-grid">
        <div class="cg-col">
            <div class="panel cg-section">
                <h3>General</h3>
                <div class="form-group cg-field">
                    <label for="cgName"><span class="req">*</span> Name of the configuration</label>
                    <input type="text" id="cgName" placeholder="Please enter">
                    <div class="cg-err" id="errName"></div>
                </div>
                <div class="form-group cg-field">
                    <label for="cgAppName"><span class="req">*</span> Application name
                        <span class="cg-tip" title="Display name of the branded client (English characters only)">?</span></label>
                    <input type="text" id="cgAppName" placeholder="Please enter">
                    <div class="cg-err" id="errAppName"></div>
                </div>
                <div class="form-group cg-field">
                    <label for="cgVersion">Version</label>
                    <select id="cgVersion"></select>
                </div>
                <div class="form-group cg-field" id="cgArchRow">
                    <label for="cgArch">CPU Architecture</label>
                    <select id="cgArch"><option value="x64">x64</option><option value="x86">x86</option></select>
                </div>
                <div class="form-group cg-field">
                    <label><span class="req">*</span> Connection type</label>
                    <div class="cg-radio-row">
                        <label><input type="radio" name="cgDirection" value="both" checked> Bidirectional</label>
                        <label><input type="radio" name="cgDirection" value="incoming"> Incoming</label>
                        <label><input type="radio" name="cgDirection" value="outgoing"> Outgoing</label>
                    </div>
                </div>
                <div class="form-group cg-field">
                    <label>Options</label>
                    <div class="cg-checks">
                        <label><input type="checkbox" id="cgDisableInstall"> Disable installation
                            <span class="cg-tip" title="The client cannot be installed into the system, portable mode only">?</span></label>
                        <label><input type="checkbox" id="cgDisableSettings"> Disable settings
                            <span class="cg-tip" title="The client settings window is blocked">?</span></label>
                    </div>
                </div>
                <div class="form-group cg-field">
                    <label for="cgNote">Note</label>
                    <textarea id="cgNote" rows="4" style="width:100%;font:inherit;font-size:.88rem;background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;" placeholder="Some note about this configuration"></textarea>
                </div>
            </div>
        </div>

        <div class="cg-col">
            <div class="panel cg-section">
                <h3>Custom server</h3>
                <div class="form-group cg-field">
                    <label for="cgHost">Host:</label>
                    <input type="text" id="cgHost" placeholder="rd.example.com">
                </div>
                <div class="form-group cg-field">
                    <label for="cgKey">Key:</label>
                    <div class="cg-key-row">
                        <input type="text" id="cgKey" placeholder="Base64 public key">
                        <button type="button" class="icon-btn" title="Copy" onclick="copyKey()"><i class="fas fa-copy"></i></button>
                    </div>
                </div>
                <div class="form-group cg-field" style="margin-bottom:0;">
                    <label for="cgApi">API:</label>
                    <input type="text" id="cgApi" placeholder="https://rd.example.com:21114">
                </div>
            </div>

            <div class="panel cg-section">
                <h3>Visual</h3>
                <div class="form-group cg-field">
                    <label>Application icon <span class="cg-tip" title="PNG, square dimensions">?</span></label>
                    <label class="cg-upload" for="cgIconFile"><i class="fas fa-upload"></i> Click or drag to upload</label>
                    <input type="file" id="cgIconFile" accept="image/png" style="display:none" onchange="pickImage(this,'icon')">
                    <div class="cg-preview" id="iconPreview"><img alt=""><span class="name"></span>
                        <button type="button" class="icon-btn" title="Remove" onclick="clearImage('icon')"><i class="fas fa-times"></i></button></div>
                    <div class="cg-err" id="errIcon"></div>
                </div>
                <div class="form-group cg-field" style="margin-bottom:0;">
                    <label>Light Logo <span class="cg-tip" title="PNG, shown on dark backgrounds">?</span></label>
                    <label class="cg-upload" for="cgLogoFile"><i class="fas fa-upload"></i> Click or drag to upload</label>
                    <input type="file" id="cgLogoFile" accept="image/png" style="display:none" onchange="pickImage(this,'logo')">
                    <div class="cg-preview" id="logoPreview"><img alt=""><span class="name"></span>
                        <button type="button" class="icon-btn" title="Remove" onclick="clearImage('logo')"><i class="fas fa-times"></i></button></div>
                    <div class="cg-err" id="errLogo"></div>
                </div>
            </div>

            <div class="panel cg-section">
                <h3>Security</h3>
                <div class="cg-switch-row">
                    <span>Preset password :</span>
                    <label class="switch"><input type="checkbox" id="cgPresetPass" onchange="togglePresetPass()"><span class="slider"></span></label>
                </div>
                <div class="form-group cg-field cg-collapsible" id="cgPassRow" style="margin-bottom:0;">
                    <label for="cgPassValue">Permanent password</label>
                    <input type="text" id="cgPassValue" placeholder="Please enter">
                    <div class="cg-err" id="errPass"></div>
                </div>
            </div>

            <div class="panel cg-section">
                <h3>Advanced <span class="cg-tip" title="Manual key=value lines merged into default/override settings of the custom client">?</span></h3>
                <div class="cg-switch-row">
                    <span>Override settings :</span>
                    <label class="switch"><input type="checkbox" id="cgOverrideOn" onchange="toggleAdvanced()"><span class="slider"></span></label>
                </div>
                <div class="form-group cg-field cg-collapsible" id="cgOverrideRow">
                    <textarea id="cgOverrideManual" rows="4" style="width:100%;font-family:var(--mono);font-size:.8rem;background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;" placeholder="key=value&#10;disable-udp=Y"></textarea>
                </div>
                <div class="cg-switch-row">
                    <span>Default settings :</span>
                    <label class="switch"><input type="checkbox" id="cgDefaultOn" onchange="toggleAdvanced()"><span class="slider"></span></label>
                </div>
                <div class="form-group cg-field cg-collapsible" id="cgDefaultRow" style="margin-bottom:0;">
                    <textarea id="cgDefaultManual" rows="4" style="width:100%;font-family:var(--mono);font-size:.8rem;background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;" placeholder="key=value&#10;lang=ru"></textarea>
                </div>
            </div>
        </div>
    </div>

    <div class="cg-foot">
        <button class="btn btn-ghost" onclick="closeEditor()">Back</button>
        <button class="btn btn-primary" id="cgSaveBtn" onclick="saveCfg()">Create</button>
    </div>
</div>

<div id="toast" class="toast-notification"><i class="fas fa-info-circle"></i><span id="toastMessage"></span></div>
