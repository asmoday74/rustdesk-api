<script>
    function escapeHtml(s){ if(s===null||s===undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function showToast(m,err=false){ const tEl=document.getElementById('toast'); const msg=document.getElementById('toastMessage'); const i=tEl.querySelector('i');
        msg.textContent=m; i.className=err?'fas fa-exclamation-triangle':'fas fa-check-circle';
        tEl.style.borderLeftColor=err?'var(--danger)':'var(--accent)'; tEl.classList.add('show'); setTimeout(()=>tEl.classList.remove('show'),3000); }

    const VERSIONS=[['master','nightly'],['1.4.9','1.4.9'],['1.4.8','1.4.8'],['1.4.7','1.4.7'],['1.4.6','1.4.6'],['1.4.5','1.4.5'],['1.4.4','1.4.4'],['1.4.3','1.4.3'],['1.4.2','1.4.2'],['1.4.1','1.4.1'],['1.4.0','1.4.0']];
    const OS_ICON={windows:'fab fa-windows', linux:'fab fa-linux', macos:'fab fa-apple', android:'fab fa-android'};
    let configs=[], editCfgId=null, curOs='windows';
    let images={icon:'', logo:''};

    function fmtDate(d){ if(!d) return '—'; const dt=new Date(d); return isNaN(dt)?'—':dt.toLocaleString(t('locale')); }
    function val(id){ return document.getElementById(id).value; }
    function chk(id){ return document.getElementById(id).checked; }
    function setErr(id,msg){ const el=document.getElementById(id); el.textContent=msg||''; el.classList.toggle('show',!!msg); }

    /* ---------- список конфигураций ---------- */
    async function loadConfigs(){
        try{ const r=await fetch('/api/web/clientgen/configs'); if(!r.ok) return;
            configs=await r.json(); renderConfigs(); }catch(e){}
    }

    function buildCell(c){
        const runLink = /^https?:\/\//.test(c.build_log||'')
            ? ` <a class="icon-btn" href="${escapeHtml(c.build_log)}" target="_blank" rel="noopener" title="GitHub Actions"><i class="fas fa-external-link-alt"></i></a>` : '';
        if(c.build_status==='running') return `<span class="status-online"><i class="fas fa-circle"></i>${t('cg_building')}</span>` + runLink;
        let html='';
        if(c.build_status==='success')
            html += `<a class="btn btn-ghost btn-sm" href="/api/web/clientgen/configs/${c.id}/download"><i class="fas fa-download"></i> ${t('cg_download')}</a> `;
        if(c.build_status!=='running')
            html += `<button class="btn btn-primary btn-sm" onclick="startBuild(${c.id})"><i class="fas fa-hammer"></i> ${t('cg_build')}</button>`;
        if(c.build_status==='failed') html += ` <span class="status-offline"><i class="fas fa-circle"></i>${t('cg_error')}</span>` + runLink;
        return html || '—';
    }

    function renderConfigs(){
        const tb=document.getElementById('cfgBody');
        if(!configs.length){ tb.innerHTML=`<tr><td colspan="7" class="empty-state">${t('cg_no_configs')}</td></tr>`; return; }
        tb.innerHTML=configs.map(c=>`<tr>
            <td><b>${escapeHtml(c.name)}</b></td>
            <td><i class="${OS_ICON[c.platform]||'fas fa-desktop'}"></i> ${escapeHtml((c.platform||'').replace('windows-x86','windows (x86)'))}</td>
            <td>${escapeHtml(c.version||'—')}</td>
            <td>${buildCell(c)}</td>
            <td>${fmtDate(c.build_date)}</td>
            <td>${escapeHtml(c.author||'')}</td>
            <td><div class="action-cell">
                <button class="btn btn-ghost btn-sm" data-i18n-title="edit" onclick="openEditor(${c.id})"><i class="fas fa-edit"></i></button>
                <button class="btn btn-ghost btn-sm" data-i18n-title="duplicate" onclick="dupCfg(${c.id})"><i class="fas fa-copy"></i></button>
                <button class="btn btn-danger btn-sm" data-i18n-title="delete" onclick="delCfg(${c.id})"><i class="fas fa-trash"></i></button>
            </div></td></tr>`).join('');
        applyI18n(tb);
    }

    async function startBuild(id){
        try{ const r=await fetch(`/api/web/clientgen/configs/${id}/build`,{method:'POST'});
            const d=await r.json().catch(()=>({}));
            if(!r.ok){ showToast(d.error || (t('cg_build_error')+' (HTTP '+r.status+')'),true); return; }
            loadConfigs(); pollStatus(id);
        }catch(e){ showToast(t('error')+': '+e,true); }
    }
    function pollStatus(id){
        const tId=setInterval(async()=>{
            try{ const r=await fetch(`/api/web/clientgen/configs/${id}/status`); const d=await r.json();
                if(d.build_status!=='running'){ clearInterval(tId); loadConfigs(); }
            }catch(e){ clearInterval(tId); }
        }, 5000);
    }

    async function dupCfg(id){ try{ await fetch(`/api/web/clientgen/configs/${id}/duplicate`,{method:'POST'}); loadConfigs(); }catch(e){} }
    async function delCfg(id){ if(!confirm(t('cg_confirm_delete'))) return;
        try{ await fetch(`/api/web/clientgen/configs/${id}`,{method:'DELETE'}); loadConfigs(); }catch(e){} }

    /* ---------- редактор ---------- */
    function showEditor(on){
        document.getElementById('cfgListView').style.display = on?'none':'';
        document.getElementById('cfgEditorView').style.display = on?'':'none';
    }

    function setOs(os){
        curOs=os;
        document.querySelectorAll('.cg-os-btn').forEach(b=>b.classList.toggle('active', b.dataset.os===os));
        document.getElementById('cgArchRow').style.display = os==='windows'?'':'none';
    }

    function togglePresetPass(){
        document.getElementById('cgPassRow').classList.toggle('show', chk('cgPresetPass'));
        if(!chk('cgPresetPass')) setErr('errPass','');
    }
    function toggleAdvanced(){
        document.getElementById('cgOverrideRow').classList.toggle('show', chk('cgOverrideOn'));
        document.getElementById('cgDefaultRow').classList.toggle('show', chk('cgDefaultOn'));
    }

    function copyKey(){
        const v=val('cgKey'); if(!v) return;
        navigator.clipboard.writeText(v).then(()=>showToast(t('cg_key_copied')));
    }

    function pickImage(input,kind){
        const file=input.files && input.files[0]; input.value='';
        if(!file) return;
        const errId = kind==='icon'?'errIcon':'errLogo';
        setErr(errId,'');
        if(file.type!=='image/png'){ setErr(errId,t('cg_png_only')); return; }
        const reader=new FileReader();
        reader.onload=e=>{
            const dataUrl=e.target.result;
            if(kind==='logo'){ setImage('logo',dataUrl,file.name); return; }
            const img=new Image();
            img.onload=()=>{ if(img.naturalWidth!==img.naturalHeight){ setErr(errId,t('cg_icon_square')); return; }
                setImage('icon',dataUrl,file.name); };
            img.onerror=()=>setErr(errId,t('cg_icon_invalid'));
            img.src=dataUrl;
        };
        reader.readAsDataURL(file);
    }

    function setImage(kind,dataUrl,name){
        images[kind]=dataUrl||'';
        const p=document.getElementById(kind==='icon'?'iconPreview':'logoPreview');
        p.classList.toggle('show',!!dataUrl);
        if(dataUrl){ p.querySelector('img').src=dataUrl; p.querySelector('.name').textContent=name||''; }
    }
    function clearImage(kind){ setImage(kind,'',''); }

    function openEditor(id){
        editCfgId=id||null;
        document.getElementById('cgSaveBtn').textContent = id?t('save'):t('create');
        const vs=document.getElementById('cgVersion');
        vs.innerHTML=VERSIONS.map(v=>`<option value="${v[0]}">${v[1]}</option>`).join('');
        ['cgName','cgAppName','cgHost','cgKey','cgApi','cgNote','cgPassValue','cgOverrideManual','cgDefaultManual']
            .forEach(i=>document.getElementById(i).value='');
        ['cgDisableInstall','cgDisableSettings','cgPresetPass','cgOverrideOn','cgDefaultOn'].forEach(i=>document.getElementById(i).checked=false);
        document.querySelector('input[name="cgDirection"][value="both"]').checked=true;
        vs.value='1.4.9';
        clearImage('icon'); clearImage('logo');
        ['errName','errAppName','errIcon','errLogo','errPass'].forEach(i=>setErr(i,''));

        if(id){
            const c=configs.find(x=>x.id===id); if(!c) return;
            let cfg={}; try{ cfg=JSON.parse(c.config_json||'{}'); }catch(e){}
            document.getElementById('cgName').value=c.name||'';
            document.getElementById('cgAppName').value=cfg.appname||'';
            const platform=cfg.platform||'windows';
            setOs(platform==='windows-x86'?'windows':(OS_ICON[platform]?platform:'windows'));
            document.getElementById('cgArch').value = platform==='windows-x86'?'x86':'x64';
            if(VERSIONS.some(v=>v[0]===cfg.version)) vs.value=cfg.version;
            const dir=['incoming','outgoing','both'].includes(cfg.direction)?cfg.direction:'both';
            document.querySelector(`input[name="cgDirection"][value="${dir}"]`).checked=true;
            document.getElementById('cgDisableInstall').checked = cfg.installation==='installationN';
            document.getElementById('cgDisableSettings').checked = cfg.settings==='settingsN';
            document.getElementById('cgHost').value=cfg.serverIP||'';
            document.getElementById('cgKey').value=cfg.key||'';
            document.getElementById('cgApi').value=cfg.apiServer||'';
            document.getElementById('cgNote').value=cfg.note||'';
            if(cfg.iconbase64) setImage('icon',cfg.iconbase64,'');
            if(cfg.logobase64) setImage('logo',cfg.logobase64,'');
            if(cfg.permanentPassword){ document.getElementById('cgPresetPass').checked=true;
                document.getElementById('cgPassValue').value=cfg.permanentPassword; }
            if(cfg.overrideManual){ document.getElementById('cgOverrideOn').checked=true;
                document.getElementById('cgOverrideManual').value=cfg.overrideManual; }
            if(cfg.defaultManual){ document.getElementById('cgDefaultOn').checked=true;
                document.getElementById('cgDefaultManual').value=cfg.defaultManual; }
        } else {
            setOs('windows');
            document.getElementById('cgArch').value='x64';
        }
        togglePresetPass(); toggleAdvanced();
        showEditor(true);
    }

    function closeEditor(){ showEditor(false); }

    function collectCfg(){
        const platform = (curOs==='windows' && val('cgArch')==='x86') ? 'windows-x86' : curOs;
        return {
            exename: val('cgName').trim(),
            platform,
            version: val('cgVersion'),
            appname: val('cgAppName').trim(),
            direction: document.querySelector('input[name="cgDirection"]:checked').value,
            installation: chk('cgDisableInstall')?'installationN':'installationY',
            settings: chk('cgDisableSettings')?'settingsN':'settingsY',
            serverIP: val('cgHost').trim(),
            key: val('cgKey').trim(),
            apiServer: val('cgApi').trim(),
            iconbase64: images.icon,
            logobase64: images.logo,
            permanentPassword: chk('cgPresetPass')?val('cgPassValue').trim():'',
            overrideManual: chk('cgOverrideOn')?val('cgOverrideManual'):'',
            defaultManual: chk('cgDefaultOn')?val('cgDefaultManual'):'',
            note: val('cgNote').trim()
        };
    }

    function validateForm(name,cfg){
        let ok=true;
        if(!name){ setErr('errName',t('cg_required')); ok=false; }
        else if(!/^[A-Za-z0-9_-]+$/.test(name)){ setErr('errName',t('cg_name_format')); ok=false; }
        if(!cfg.appname){ setErr('errAppName',t('cg_required')); ok=false; }
        else if(!cfg.appname.split('').every(c=>c.charCodeAt(0)<128)){ setErr('errAppName',t('cg_english_only')); ok=false; }
        if(chk('cgPresetPass') && !cfg.permanentPassword){ setErr('errPass',t('cg_required')); ok=false; }
        return ok;
    }

    async function saveCfg(){
        const name=val('cgName').trim();
        const cfg=collectCfg();
        if(!validateForm(name,cfg)) return;
        const body={name, config_json: cfg};
        try{
            const r = editCfgId
                ? await fetch(`/api/web/clientgen/configs/${editCfgId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
                : await fetch('/api/web/clientgen/configs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
            if(!r.ok){
                const d=await r.json().catch(()=>({}));
                const details=d.details?Object.values(d.details).join(' '):'';
                showToast(d.error||(t('cg_save_error')+' (HTTP '+r.status+')')+(details?' '+details:''),true);
                return;
            }
            closeEditor(); loadConfigs(); showToast(t('cg_saved'));
        }catch(e){ showToast(t('error')+': '+e,true); }
    }

    document.querySelectorAll('.cg-os-btn').forEach(b=>b.addEventListener('click',()=>setOs(b.dataset.os)));
    loadConfigs();
</script>
