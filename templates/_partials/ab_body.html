<h1 class="page-title" data-i18n="nav_device_lists">Списки устройств</h1>

<div class="subnav">
    <button class="subnav-btn active" data-abtab="ab"><i class="fas fa-book"></i> <span data-i18n="tab_address_book">Адресная книга</span></button>
    <button class="subnav-btn" data-abtab="collections"><i class="fas fa-layer-group"></i> <span data-i18n="tab_collections">Коллекции</span></button>
</div>

<section id="absection-ab">
<div class="panel">
    <div class="panel-head">
        <h3 data-i18n="ab_book">Книга</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
            <select id="abSelector" class="search-type-select" onchange="onAbSelected()"><option value="" data-i18n="loading">Загрузка...</option></select>
            <button class="btn btn-primary" id="addPeerBtn" onclick="openPeerModal()"><i class="fas fa-plus"></i> <span data-i18n="add">Добавить</span></button>
            <button class="btn btn-ghost" onclick="openTagsModal()"><i class="fas fa-tags"></i> <span data-i18n="tags">Теги</span></button>
            <button class="btn btn-ghost" onclick="openCollectionsTab()"><i class="fas fa-folder"></i> <span data-i18n="shared_books">Коллекции</span></button>
            <button class="btn btn-ghost" onclick="loadAll()"><i class="fas fa-sync-alt"></i></button>
        </div>
    </div>
    <div class="panel-body">
        <div class="readonly-note" id="readonlyNote" style="display:none;"><i class="fas fa-eye"></i> <span data-i18n="read_only">Только чтение</span></div>
        <div class="search-wrapper" style="margin-bottom:14px;">
            <div class="search-input-wrapper"><i class="fas fa-search"></i>
                <input type="text" id="peerSearch" class="search-input" data-i18n-ph="peer_search_ph" placeholder="Поиск по ID, имени, тегам..." oninput="renderPeers()"></div>
            <span style="color:var(--muted);font-size:.82rem;"><span data-i18n="records">Записей</span>: <b id="peerCount">0</b> · <span data-i18n="tags">Тегов</span>: <b id="tagCount">0</b></span>
        </div>
        <div class="table-wrapper">
            <table class="computers-table">
                <thead><tr>
                    <th data-i18n="col_num">№</th>
                    <th>ID</th>
                    <th data-i18n="col_name_alias">Имя / Алиас</th>
                    <th data-i18n="col_user">Пользователь</th>
                    <th data-i18n="col_platform">Платформа</th>
                    <th data-i18n="col_status">Статус</th>
                    <th data-i18n="tags">Теги</th>
                    <th data-i18n="col_actions">Действия</th>
                </tr></thead>
                <tbody id="peersTableBody"><tr><td colspan="8" class="empty-state"><i class="fas fa-spinner fa-pulse"></i><span data-i18n="loading">Загрузка...</span></td></tr></tbody>
            </table>
        </div>
    </div>
</div>
</section>

<section id="absection-collections" style="display:none;">
<div class="panel">
    <div class="panel-head">
        <h3 data-i18n="tab_collections">Коллекции</h3>
    </div>
    <div class="panel-body">
        <form onsubmit="createCollection(event)" style="display:flex;gap:8px;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap;">
            <div class="form-group" style="flex:1;min-width:200px;margin:0;"><label data-i18n="new_shared_book">Новая общая книга</label><input type="text" id="newCollectionName" required></div>
            <button type="submit" class="btn btn-primary" data-i18n="create">Создать</button>
        </form>
        <div class="table-wrapper">
            <table class="computers-table">
                <thead><tr>
                    <th data-i18n="col_name">Название</th>
                    <th data-i18n="col_owner">Владелец</th>
                    <th data-i18n="col_my_rights">Мои права</th>
                    <th data-i18n="col_actions">Действия</th>
                </tr></thead>
                <tbody id="collectionsTableBody"><tr><td colspan="4" class="empty-state" data-i18n="loading">Загрузка...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>
</section>

<!-- Модалка записи -->
<div id="peerModal" class="modal"><div class="modal-content">
    <div class="modal-header"><h3 id="peerModalTitle" data-i18n="add_record">Добавить запись</h3><button class="close" onclick="closeModal('peerModal')">&times;</button></div>
    <form id="peerForm" onsubmit="savePeer(event)">
        <div class="form-group"><label><span data-i18n="peer_device_id">ID оборудования</span> *</label><input type="text" id="peerId" required></div>
        <div class="form-group"><label data-i18n="peer_alias">Алиас</label><input type="text" id="peerAlias"></div>
        <div class="form-group"><label data-i18n="peer_hostname">Имя хоста</label><input type="text" id="peerHostname"></div>
        <div class="form-group"><label data-i18n="col_user">Пользователь</label><input type="text" id="peerUsername"></div>
        <div class="form-group"><label data-i18n="col_platform">Платформа</label><select id="peerPlatform"><option value="" data-i18n="platform_unknown">Не определена</option><option>Windows</option><option>Linux</option><option>Mac OS</option><option>Android</option></select></div>
        <div class="form-group"><label data-i18n="peer_password">Пароль</label><input type="text" id="peerPassword"></div>
        <div class="form-group"><label data-i18n="tags">Теги</label><div class="tags-checkbox-list" id="peerTagsList"></div></div>
        <div class="form-group"><label data-i18n="peer_note">Заметка</label><input type="text" id="peerNote"></div>
        <div class="form-group"><label style="display:flex;align-items:center;gap:8px;"><input type="checkbox" id="peerForceRelay" style="width:auto;"> <span data-i18n="force_relay">Всегда через ретранслятор</span></label></div>
        <button type="submit" class="btn btn-primary" data-i18n="save">Сохранить</button>
    </form>
</div></div>

<!-- Модалка тегов -->
<div id="tagsModal" class="modal"><div class="modal-content">
    <div class="modal-header"><h3 data-i18n="tags">Теги</h3><button class="close" onclick="closeModal('tagsModal')">&times;</button></div>
    <div id="tagsList"></div>
    <form onsubmit="addTag(event)" style="display:flex;gap:8px;align-items:flex-end;margin-top:12px;flex-wrap:wrap;">
        <div class="form-group" style="flex:1;margin:0;"><label data-i18n="new_tag">Новый тег</label><input type="text" id="newTagName" required></div>
        <div class="form-group" style="margin:0;"><label data-i18n="color">Цвет</label><input type="color" id="newTagColor" value="#1976d2" style="width:56px;height:38px;"></div>
        <button type="submit" class="btn btn-primary" data-i18n="add">Добавить</button>
    </form>
</div></div>

<!-- Модалка переименования коллекции -->
<div id="renameCollectionModal" class="modal"><div class="modal-content">
    <div class="modal-header"><h3 data-i18n="rename">Переименовать</h3><button class="close" onclick="closeModal('renameCollectionModal')">&times;</button></div>
    <form onsubmit="submitRenameCollection(event)">
        <div class="form-group"><label data-i18n="new_name_prompt">Новое имя:</label><input type="text" id="renameCollectionName" required></div>
        <button type="submit" class="btn btn-primary" data-i18n="save">Сохранить</button>
    </form>
</div></div>

<!-- Модалка шаринга -->
<div id="shareModal" class="modal"><div class="modal-content">
    <div class="modal-header"><h3 id="shareModalTitle" data-i18n="share_title">Общий доступ</h3><button class="close" onclick="closeModal('shareModal')">&times;</button></div>
    <div id="ownerChangeBlock" style="display:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;margin-bottom:12px;">
        <label data-i18n="col_owner" style="font-size:.82rem;">Владелец</label>
        <div class="add-member-row" style="margin-top:4px;">
            <select id="ownerSelect"></select>
            <button type="button" class="btn btn-warn btn-sm" onclick="changeOwner()"><i class="fas fa-user-check"></i> <span data-i18n="change_owner">Сменить владельца</span></button>
        </div>
    </div>
    <div id="rulesList"></div>
    <form onsubmit="saveRule(event)" style="display:flex;gap:8px;align-items:flex-end;margin-top:12px;flex-wrap:wrap;">
        <div class="form-group" style="margin:0;"><label data-i18n="share_to">Кому</label><select id="ruleType" onchange="onRuleTypeChange()"><option value="1" data-i18n="user_label">Пользователь</option><option value="2" data-i18n="group">Группа</option></select></div>
        <div class="form-group" style="margin:0;"><label id="ruleTargetLabel" data-i18n="user_label">Пользователь</label><select id="ruleUser" required></select></div>
        <div class="form-group" style="margin:0;"><label data-i18n="share_rights">Права</label><select id="ruleLevel"><option value="1" data-i18n="rule_read">Чтение</option><option value="2" data-i18n="rule_readwrite">Чтение и запись</option><option value="3" data-i18n="rule_full">Полный доступ</option></select></div>
        <button type="submit" class="btn btn-primary" data-i18n="grant">Предоставить</button>
    </form>
</div></div>

<div id="toast" class="toast-notification"><i class="fas fa-info-circle"></i><span id="toastMessage"></span></div>
